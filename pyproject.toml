[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bolt-ai"
version = "0.1.0"
description = "BOLT - Personal Autonomous AI Assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "markdown>=3.5.0",
]

[project.scripts]
bolt = "run:main"

